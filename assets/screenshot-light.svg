<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="535" viewBox="0 0 1100 535" role="img" aria-label="Exemplo de cadastro de produto e resposta HTTP"><rect width="1100" height="535" rx="16" fill="#F5F8FF"/><rect x="22" y="22" width="1056" height="491" rx="10" fill="#FFFFFF" stroke="#2379E8" stroke-opacity=".4"/><text x="44" y="59" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#475569">STOREAPI / EXEMPLO HTTP · RESPOSTA CONFERIDA LOCALMENTE</text><g font-family="Consolas,monospace" font-size="19"><text x="44" y="105" fill="#2379E8">$ POST http://localhost:8080/api/produtos</text><text x="44" y="130" fill="#0F1E3A"></text><text x="44" y="155" fill="#0F1E3A">{ &quot;nome&quot;: &quot;Teclado&quot;, &quot;descricao&quot;: &quot;Teclado USB&quot;,</text><text x="44" y="180" fill="#0F1E3A">  &quot;preco&quot;: 149.90, &quot;estoque&quot;: 10, &quot;categoria&quot;: &quot;Perifericos&quot; }</text><text x="44" y="205" fill="#0F1E3A"></text><text x="44" y="230" fill="#2379E8">HTTP/1.1 201 Created</text><text x="44" y="255" fill="#2379E8">Location: /api/produtos/1</text><text x="44" y="280" fill="#0F1E3A"></text><text x="44" y="305" fill="#0F1E3A">{</text><text x="44" y="330" fill="#0F1E3A">  &quot;id&quot;: 1,</text><text x="44" y="355" fill="#0F1E3A">  &quot;nome&quot;: &quot;Teclado&quot;,</text><text x="44" y="380" fill="#0F1E3A">  &quot;descricao&quot;: &quot;Teclado USB&quot;,</text><text x="44" y="405" fill="#0F1E3A">  &quot;preco&quot;: 149.90,</text><text x="44" y="430" fill="#0F1E3A">  &quot;estoque&quot;: 10,</text><text x="44" y="455" fill="#0F1E3A">  &quot;categoria&quot;: &quot;Perifericos&quot;</text><text x="44" y="480" fill="#0F1E3A">}</text></g></svg>